<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bruchinsel-Mission 7 HS</title>
<style>body{font-family:Arial,Helvetica,sans-serif;background:#eef8ff;color:#182033;margin:0;display:grid;place-items:center;min-height:100vh}.box{max-width:680px;margin:24px;padding:28px;background:white;border:4px solid #182033;border-radius:24px;box-shadow:8px 8px 0 #b9d9ef;text-align:center}h1{color:#0f3f75}.spin{font-size:2.2rem;animation:r 1.2s linear infinite}@keyframes r{to{transform:rotate(360deg)}}.err{color:#a40022;white-space:pre-wrap}</style>
</head>
<body><div class="box"><div class="spin">🧭</div><h1>Bruchinsel-Mission wird geladen …</h1><p>Die Schatzkarte wird vorbereitet.</p><p id="msg"></p></div>
<script>
(async()=>{const names=Array.from({length:13},(_,i)=>`parts/part${String(i+1).padStart(2,'0')}.txt`);try{const rs=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'})));for(const r of rs)if(!r.ok)throw new Error(`${r.url}: ${r.status}`);const html=(await Promise.all(rs.map(r=>r.text()))).join('');document.open();document.write(html);document.close();}catch(e){document.getElementById('msg').className='err';document.getElementById('msg').textContent='Die Bruchmission konnte nicht geladen werden. Bitte die Seite neu laden.\n'+e;}})();
</script></body></html>
